<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Générateur de Fiches d'Exercices</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0284c7" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Playfair+Display:wght@700&family=Roboto+Slab:wght@400;700&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@500;600;700;800&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/fonts.css">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['IBM Plex Sans', 'sans-serif'],
              serif: ['IBM Plex Serif', 'serif'],
              display: ['IBM Plex Sans', 'sans-serif'],
              beamer: ['"Computer Modern Sans"', 'sans-serif'],
              latex: ['"Computer Modern Serif"', 'serif'],
              handwriting: ['Caveat', 'cursive'],
            },
          },
        },
      }
    </script>
    <style>
      /* Styles de base pour l'écran */
      body {
        background-color: #f8fafc; /* Gris clair (slate-50) */
        color: #000000;
      }
      
      .text-slate-900,
      .text-slate-800,
      .text-gray-900,
      .text-gray-700 {
        color: #1e293b !important; /* slate-800 pour un bon contraste */
      }
      
      .prose {
        font-family: 'Roboto Slab', serif;
        color: #1e293b !important;
      }
      
      .prose * {
        color: #1e293b !important;
      }
      
      /* Fix MathJax alignment issues in flex containers */
      mjx-container[jax="SVG"] {
        text-align: initial !important;
      }

      /* Ergonomie tablette Android : cibles tactiles confortables sans
         agrandir artificiellement les boutons internes des panneaux. */
      .canvas-toolbar {
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-x: contain;
      }

      .canvas-toolbar button,
      .canvas-toolbar input,
      .canvas-toolbar label {
        touch-action: manipulation;
      }

      .canvas-toolbar .absolute.top-full {
        max-width: calc(100vw - 16px);
      }

      @media (pointer: coarse) {
        .canvas-toolbar > div > div > button,
        .canvas-toolbar > div > button {
          min-width: 42px;
          min-height: 42px;
        }

        .canvas-toolbar input[type="range"] {
          min-height: 30px;
        }

        .canvas-compiled-text {
          padding: 4px 7px;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
