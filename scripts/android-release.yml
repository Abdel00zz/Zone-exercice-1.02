name: Build Signed Android APK & Google Play AAB

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Google Play Package Name (Application ID)'
        required: true
        default: 'com.interactivemaths.app'
      version_name:
        description: 'Version Name (ex: 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version Code entier (ex: 1)'
        required: true
        default: '1'
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Générer APK & AAB Signés (API 35)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configuration de Java JDK 21 (requis pour Android Gradle Plugin 8+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configuration du SDK Android (API 35)
        uses: android-actions/setup-android@v3

      - name: Installation des dépendances Web & Capacitor
        run: |
          npm install
          npm install -D @capacitor/cli @capacitor/core @capacitor/android

      - name: Compilation de l'APK et de l'AAB signés
        env:
          APP_ID: ${{ github.event.inputs.app_id || 'com.interactivemaths.app' }}
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'InteractiveMaths2026!' }}
        run: |
          chmod +x ./scripts/build-signed-android.sh
          ./scripts/build-signed-android.sh

      - name: Publication des artefacts signés (APK + AAB + Keystore)
        uses: actions/upload-artifact@v4
        with:
          name: InteractiveMaths-GooglePlay-Release-v${{ github.event.inputs.version_name || '1.0.0' }}
          path: |
            release-android/*.apk
            release-android/*.aab
            android-keystore/*.jks
            public/.well-known/assetlinks.json
          retention-days: 90
